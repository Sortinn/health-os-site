<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>health-os</title>
<style>
:root {
  color-scheme: light;
  --bg: #F2F3F5; --surface: #FFFFFF; --bar: rgba(242,243,245,.82); --sep: rgba(21,23,26,.10);
  --ink: #15171A; --ink2: #5E636B; --muted: #8D929A; --grid: #E6E8EB; --track: #E9EBEE;
  --kcal: #2A78D6; --kcal-track: rgba(42,120,214,.16); --kcal-soft: rgba(42,120,214,.14);
  --pro: #EB6834; --pro-track: rgba(235,104,52,.16);
  --train: #1BAF7A; --train-track: rgba(27,175,122,.16);
  --fat: #EDA100; --fat-track: rgba(237,161,0,.18);
  --carb: #E87BA4; --carb-track: rgba(232,123,164,.18);
  --over: #FF3B30;
  --sleep: #5E5CE6;
  --dot: #A9AEB6; --tip: #FFFFFF; --shadow: 0 8px 28px rgba(21,23,26,.12);
  --seg: #E4E6EA; --seg-on: #FFFFFF;
  --hero: #15171A; --hero-line: rgba(255,255,255,.08); --goal: #2BD49A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  --tab-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0E1013; --surface: #1A1D22; --bar: rgba(14,16,19,.80); --sep: rgba(255,255,255,.10);
    --ink: #F1F2F4; --ink2: #A9AEB6; --muted: #7E848D; --grid: #2A2E35; --track: #2A2E35;
    --kcal: #3987E5; --kcal-track: rgba(57,135,229,.22); --kcal-soft: rgba(57,135,229,.20);
    --pro: #D95926; --pro-track: rgba(217,89,38,.24);
    --train: #199E70; --train-track: rgba(25,158,112,.24);
    --fat: #C98500; --fat-track: rgba(201,133,0,.26);
    --carb: #D55181; --carb-track: rgba(213,81,129,.26);
    --over: #FF453A;
    --sleep: #7D7AFF;
    --dot: #5E636B; --tip: #23272D; --shadow: 0 8px 28px rgba(0,0,0,.5);
    --seg: #23272D; --seg-on: #3A3F47;
    --hero: #1F2A26; --hero-line: rgba(255,255,255,.10); --goal: #2BD49A;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: pan-x pan-y; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--kcal); outline-offset: 2px; border-radius: 6px; }

/* 顶部：滚动后出现的小标题栏 */
.navbar { position: fixed; inset: 0 0 auto 0; z-index: 10; padding-top: env(safe-area-inset-top);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .2s; }
.navbar .t { height: 44px; display: grid; place-items: center; font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; }
.navbar.on { border-bottom-color: var(--sep); }
.refresh { position: absolute; right: 8px; bottom: 4px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--kcal); }
.refresh svg { width: 21px; height: 21px; }
.refresh:active { background: var(--seg); }
.refresh.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.navbar.on .t { opacity: 1; }

.view { display: none; max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 52px) 16px 0; }
.view.on { display: block; }
.large { margin: 0 0 2px; font-size: 34px; font-weight: 700; letter-spacing: .01em; }
.sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.upd { margin-left: auto; font-size: 13px; }
#updated { margin-left: auto; font-size: 13px; }
.pill { font-size: 12px; color: var(--ink2); border: 1px solid var(--sep); border-radius: 999px; padding: 1px 8px; }

/* 首页目标卡：整页唯一的深色块 */
.goal { background: var(--hero); color: #F1F2F4; border-radius: 22px; padding: 18px 18px 14px; margin-bottom: 14px; display: grid; gap: 14px; border: 1px solid var(--hero-line); }
.goal .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.goal .eyebrow { font-size: 13px; color: rgba(241,242,244,.62); }
.goal .title { font-size: 20px; font-weight: 700; margin-top: 2px; }
.goal .count { text-align: right; line-height: 1; }
.goal .count b { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--goal); }
.goal .count span { display: block; font-size: 12px; color: rgba(241,242,244,.62); margin-top: 4px; }
.goal .nums { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 10px; }
.goal .nums .end { font-size: 13px; color: rgba(241,242,244,.62); font-variant-numeric: tabular-nums; }
.goal .nums .end b { display: block; font-size: 17px; color: #F1F2F4; font-weight: 600; }
.goal .nums .now { text-align: center; font-variant-numeric: tabular-nums; }
.goal .nums .now b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
.goal .nums .now small { font-size: 15px; font-weight: 500; margin-left: 1px; }
.goal .nums .now span { display: block; font-size: 12px; color: rgba(241,242,244,.62); }
.goal svg { display: block; width: 100%; height: 150px; overflow: visible; }
.goal svg text { font-family: var(--font); font-size: 10px; fill: rgba(241,242,244,.55); font-variant-numeric: tabular-nums; }
.goal .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(241,242,244,.82); line-height: 1.5; }
.goal .status i { flex: none; font-style: normal; font-size: 12px; font-weight: 600; color: #0E1013; background: var(--goal); border-radius: 999px; padding: 1px 8px; }
.goal .status i.behind { background: #F5B14C; }
.cols.wk { grid-template-columns: 1fr 58px 58px 52px; }
.chip2 { flex: none; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.chip2.good { color: #fff; background: var(--train); }
.chip2.warn { color: #fff; background: #E0892B; }
.chip2.idle { color: var(--muted); border: 1px solid var(--sep); font-weight: 500; }
.row.now { background: color-mix(in srgb, var(--train) 8%, transparent); }

/* 首页圆环 */
.rings { background: var(--surface); border-radius: 22px; padding: 20px 16px 18px; display: grid; justify-items: center; gap: 18px; }
.ring-wrap { position: relative; width: min(240px, 100%); aspect-ratio: 1; }
.ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 16%; display: grid; align-content: center; justify-items: center; gap: 8px; text-align: center; }
.ring-sep { width: 64%; border-top: .5px solid var(--sep); }
/* 能量账：今天到现在（实际）＋ 近 7 天平均对目标，看问题出在吃还是动 */
.energy { width: 100%; border-top: .5px solid var(--sep); padding-top: 14px; display: grid; gap: 12px; }
.eh { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; }
.eh small { font-size: 12px; font-weight: 400; color: var(--muted); }
.eq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.eq > div { background: var(--seg); border-radius: 12px; padding: 10px 4px 9px; }
.eq .k { font-size: 12px; color: var(--ink2); }
.eq .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.eq .g { font-size: 11px; color: var(--muted); line-height: 1.35; }
.eq .g b { font-weight: 600; }
.ok-t { color: var(--train); } .bad-t { color: var(--over); }
.wrow { display: grid; grid-template-columns: 34px 1fr 92px; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); }
.wrow .tr { position: relative; height: 10px; border-radius: 5px; background: var(--track); }
.wrow .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.wrow .tr u { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--ink); text-decoration: none; }
.wrow .v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wrow .v b { font-size: 14px; color: var(--ink); }
.wrow .v small { display: block; font-size: 11px; }
.diag { padding: 10px 12px; border-radius: 12px; background: var(--seg); font-size: 13px; line-height: 1.55; color: var(--ink2); }
.diag b { color: var(--ink); }
.diag small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
.lr .k { display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--ink2); font-size: 12px; }
.lr .k i { width: 7px; height: 7px; border-radius: 50%; }
.lr .v { margin-top: 2px; font-size: 40px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.1; }
.lr .v small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.lr .h { color: var(--muted); font-size: 12px; margin-top: 4px; }
.lr .h.over { color: var(--over); font-weight: 600; }
.minis { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; border-top: .5px solid var(--sep); padding-top: 16px; }
.mini { display: grid; justify-items: center; gap: 5px; text-align: center; }
.mini .mr { position: relative; width: 64px; height: 64px; }
.mini svg { width: 64px; height: 64px; display: block; }
.mini .mv { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mini .ml { font-size: 12px; color: var(--ink2); line-height: 1.3; }
.mini .ml small { display: block; color: var(--muted); font-size: 11px; }
/* 超了上限：红色角标；达到目标：绿色对勾。白边把角标从圆环上「挖」出来 */
.mini .mv.over { color: var(--over); }
.mini .bd { position: absolute; top: -5px; right: -9px; height: 19px; min-width: 19px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 0 0 2.5px var(--surface); }
.mini .bd.over { background: var(--over); }
.mini .bd.done { background: var(--train); padding: 0; }
.mini .bd svg { width: 11px; height: 11px; }
.advice { margin: 12px 4px 0; color: var(--ink2); font-size: 14px; line-height: 1.6; }

/* 分组列表（iOS inset grouped） */
.gh { margin: 26px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.gh h2 { margin: 0; font-size: 20px; font-weight: 700; }
.gh span { color: var(--muted); font-size: 13px; }
.group { background: var(--surface); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row .l { flex: 1; min-width: 0; font-size: 16px; }
.row .l small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .r { font-size: 16px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .r small { color: var(--muted); font-size: 13px; margin-left: 3px; }
.badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.badge svg { width: 18px; height: 18px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; margin: 26px 0 6px; }

/* 趋势 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--seg); border-radius: 9px; padding: 2px; margin-bottom: 12px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chart-card { background: var(--surface); border-radius: 16px; padding: 16px 12px 10px 4px; }
.chart-head { padding: 0 4px 6px 16px; }
.chart-head .big { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.chart-head .big small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.chart-head .cap { color: var(--muted); font-size: 13px; }
.chart { position: relative; height: 230px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.keys { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; padding: 4px 4px 4px 16px; }
.keys span { display: inline-flex; align-items: center; gap: 5px; }
.keys i { display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--tip); border-radius: 10px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12px; white-space: nowrap; color: var(--ink); opacity: 0; transition: opacity .12s; z-index: 2; top: -6px; }
.tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .d { color: var(--muted); margin-right: 6px; }
.range { display: flex; justify-content: center; margin-top: 10px; }
.range .seg { width: 180px; margin: 0; }

/* 记录 */
.cols { display: grid; grid-template-columns: 1fr 66px 50px 58px; gap: 6px; align-items: center; }
.loghead { color: var(--muted); font-size: 12px; padding: 0 16px 6px; }
.loghead span, .logrow .c { text-align: right; }
.logrow { min-height: 52px; }
.logrow .d { font-size: 16px; white-space: nowrap; }
.logrow .d small { color: var(--muted); font-size: 13px; margin-left: 4px; }
.logrow .c { font-size: 15px; font-variant-numeric: tabular-nums; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
.logrow .c.dim { color: var(--muted); }
.logrow .c.over { color: var(--over); }
.ok { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.tag { display: inline-block; font-size: 11px; border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.tag.live { color: var(--ink2); border: 1px solid var(--sep); }
.tag.s { color: #fff; background: var(--train); }
.tag.w { color: var(--train); background: var(--train-track); }

/* 训练 */
.week { background: var(--surface); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; }
.week svg { width: 104px; height: 104px; display: block; }
.week .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.week .v small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.week .h { color: var(--ink2); font-size: 14px; line-height: 1.55; margin-top: 4px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 14px 8px; }
.strip .wd { color: var(--muted); font-size: 12px; }
.strip .mk { margin: 6px auto 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink2); border: 2px solid var(--track); }
.strip .s .mk { background: var(--train); border-color: var(--train); color: #fff; }
.strip .w .mk { background: var(--train-track); border-color: var(--train); color: var(--ink); }
.strip .today .wd { color: var(--ink); font-weight: 600; }
.empty { padding: 18px 16px; color: var(--ink2); font-size: 14px; line-height: 1.6; }
/* 训练计划：每个动作点开看步骤 */
.ex { position: relative; }
.ex + .ex::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; border-top: .5px solid var(--sep); }
.ex summary { list-style: none; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; cursor: pointer; }
.ex summary::-webkit-details-marker { display: none; }
.ex .no { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 14px; font-weight: 600;
  color: var(--train); background: var(--train-track); }
.ex.plain .no { color: var(--ink2); background: var(--seg); }
.ex .l { flex: 1; min-width: 0; font-size: 16px; }
.ex .l small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.ex .r { font-size: 14px; color: var(--ink2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ex .r small { display: block; color: var(--muted); font-size: 11px; }
.ex .chev { width: 14px; height: 14px; color: var(--muted); flex: none; transition: transform .2s; }
.ex[open] .chev { transform: rotate(90deg); }
.ex .body { padding: 0 16px 16px 58px; font-size: 14px; line-height: 1.65; color: var(--ink2); }
.ex .body .k { color: var(--muted); font-size: 12px; margin: 10px 0 2px; }
.ex .body .k:first-child { margin-top: 0; }
.ex .body ol, .ex .body ul { margin: 0; padding-left: 18px; }
.ex .body li + li { margin-top: 4px; }
.ex .body b { color: var(--ink); font-weight: 600; }
.ex .body .alt { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--seg); }
.ex .body .warn li::marker { color: var(--over); }
.tseg { margin: 0 0 10px; }
.vids { display: grid; gap: 6px; margin-bottom: 4px; }
.vid { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--seg); color: var(--ink); text-decoration: none; }
.vid:active { opacity: .7; }
.vid .pl { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #FB7299; }
.vid .pl svg { width: 11px; height: 11px; margin-left: 2px; }
.vid .t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.vid .t small { display: block; color: var(--muted); font-size: 12px; }

/* 底部标签栏 */
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 10; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 10px; font-weight: 500; }
.tabbar svg { width: 25px; height: 25px; }
.tabbar button[aria-selected="true"] { color: var(--kcal); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="tipsh" x="-1" y="-1" width="3" height="3" primitiveUnits="objectBoundingBox"><feGaussianBlur stdDeviation=".16"/></filter>
</defs></svg>
<header class="navbar" id="navbar"><div class="t" id="navtitle">今天</div>
  <button class="refresh" id="refresh" aria-label="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button></header>

<main>
  <section class="view" id="v-today" data-title="今天">
    <h1 class="large">今天</h1>
    <p class="sub"><span id="today-date"></span><span class="pill">进行中</span><span id="updated"></span></p>
    <div class="rings">
      <div class="ring-wrap">
        <svg viewBox="0 0 260 260" id="rings" aria-hidden="true"></svg>
        <div class="ring-center">
          <div class="lr"><div class="k"><i style="background:var(--kcal)"></i>今天吃了</div><div class="v" id="r-kcal"></div><div class="h" id="r-kcal-h"></div></div>
        </div>
      </div>
      <div class="energy" id="energy" hidden></div>
      <div class="minis" id="minis"></div>
    </div>
    <p class="advice" id="advice"></p>

    <div class="gh"><h2>身体</h2></div>
    <div class="group" id="g-body"></div>

    <div class="gh"><h2>活动和睡眠</h2><span>Apple Watch</span></div>
    <div class="group" id="g-act"></div>

    <div class="gh"><h2>近 7 天</h2><span id="week-range"></span></div>
    <div class="group" id="g-week"></div>

    <p class="foot" id="foot"></p>

"], "videos": [{"title": "坐姿器械推胸演示和中文步骤", "by": "Fitwill", "len": "网页", "url": "https://fitwill.app/zh-hans/exercise/2457/lever-chest-press/"}, {"title": "18 个固定器械 196 个动作细节", "by": "肌肉小猩猩", "len": "23 分钟", "url": "https://www.bilibili.com/video/BV1SE411e78J/", "tip": "看第 2 段「坐姿推举」"}], "main": "胸大肌（胸口）", "assist": "三角肌前束（肩膀前面）、肱三头肌（大臂后侧）", "why": "练上半身「往前推」的力量，推门、推车、撑地起身都是这个动作；胸口有了厚度，穿 T 恤更有型。器械有固定轨道，不用担心哑铃掉下来，新手练胸最安全。"}, {"id": "seated_row", "name": "坐姿划船", "muscles": "背中间", "sets": 3, "reps": "12", "rest": "2 分钟", "start": "正式组从 20～25kg 试", "steps": ["绳索版（长凳＋脚踏板＋V 形把手）：脚踩踏板，膝盖微弯，上身挺直，稍微后仰不超过 10 度。", "器械版（有胸垫）：调座椅让把手和胸口下沿一样高，胸贴住胸垫。", "拉：呼气，先把肩膀往后往下收，再用手肘带着往后拉，拉到肚脐到下胸的位置，手肘贴着身体；顶点夹紧肩胛骨，停 1 秒。", "回：吸气，2 秒慢慢放回，手臂伸直，让背被拉开。"], "feel": "两块肩胛骨中间发酸，不是只有手臂酸。", "mistakes": ["身体前后晃借力", "耸肩", "弯腰", "手腕弯"], "videos": [{"title": "「坐姿划船」的绝佳技巧分享", "by": "Gandy__", "len": "约 7 分钟", "url": "https://www.bilibili.com/video/BV11a4y1s7S8/"}, {"title": "背部训练：器械划船全方位教程", "by": "崔格图", "len": "约 4 分钟", "url": "https://www.bilibili.com/video/BV1MN4y1977d/", "tip": "健身房是有胸垫的划船机时看"}], "main": "背阔肌中下部、菱形肌、斜方肌中下部（两块肩胛骨之间）", "assist": "肱二头肌（大臂前侧）、三角肌后束（肩膀后面）", "why": "和推胸是一对：只推不拉，肩膀会往前扣成圆肩。天天坐着对电脑，最需要练两块肩胛骨之间这块，它把肩膀往后拉，改善含胸驼背，脖子和肩膀也会轻松一些。"}, {"id": "db_shoulder_press", "name": "坐姿哑铃推举", "muscles": "肩", "sets": 3, "reps": "10", "rest": "1.5 分钟", "start": "每只手 5kg 试，10 个还很轻松就换 6kg", "steps": ["准备：拿两只哑铃，可调凳靠背调到接近直立（最高或第二高那档）。", "上肩：坐下，哑铃先放大腿上，用膝盖往上一顶送到肩膀两侧；掌心朝前，手肘在哑铃正下方，哑铃在耳朵旁边。", "推：呼气，往上推到手臂快伸直，两只哑铃在头顶靠近但别碰。", "放：吸气，2 秒放回耳朵到下巴的高度。", "身体：背贴靠背，肚子收紧，腰别往前挺；手肘稍微往前收一点，别完全朝两侧。", "结束：放回肩膀，再放回大腿，然后站起来；别从头顶直接扔。"], "feel": "肩膀前面和侧面发酸。", "mistakes": ["腰往前挺成大弯", "放得太低太快", "两只哑铃在头顶撞在一起"], "videos": [{"title": "新手篇——哑铃坐姿推举", "by": "FE健身干货百科书", "len": "约 4 分钟", "url": "https://www.bilibili.com/video/BV1Lp411d7DU/"}], "main": "三角肌（肩膀，主要是前面和侧面）", "assist": "肱三头肌（大臂后侧）、斜方肌上部", "why": "肩膀宽了腰就显得细，「倒三角」的上半截主要靠它；把东西举过头顶、放上行李架都靠这个力量。哑铃两只手各自出力，左右力量不一样也能练平。"}, {"id": "plank", "name": "平板支撑", "muscles": "核心", "sets": 3, "reps": "30 秒", "rest": "1 分钟", "start": "撑不满 30 秒就膝盖着地做", "steps": ["找个垫子，前臂撑地，手肘在肩膀正下方。", "脚尖着地，两脚与髋同宽。", "从头到脚跟一条直线；肚脐往里收、屁股夹紧；屁股不撅也不塌。", "眼睛看手前面的地，脖子别抬；正常呼吸，别憋气。"], "feel": "肚子发抖发酸，腰不酸。", "mistakes": ["塌腰（腰酸就是塌了）", "屁股撅太高", "憋气"], "videos": [{"title": "平板支撑详细教学", "by": "ACE宋健鹏", "len": "约 8 分钟", "url": "https://www.bilibili.com/video/BV1paLfz8EzT/"}], "main": "腹横肌（深层腹肌，像一圈腰带）、腹直肌（肚子正面）", "assist": "臀部、肩膀", "why": "核心是连接上下半身的部分。核心稳了，做腿举、推举时腰才不晃，也更不容易腰疼，久坐的人尤其需要。注意：它不能直接「减肚子」，肚子上的脂肪靠整体减脂下去。"}]}, {"id": "B", "name": "B 日", "focus": "髋部折叠、从上往下拉、斜着推、单腿、核心", "exercises": [{"id": "db_rdl", "name": "哑铃罗马尼亚硬拉", "muscles": "大腿后侧、屁股", "sets": 3, "reps": "10", "rest": "2 分钟", "start": "每只手 8～10kg 试，先对着镜子做 1 组空手的", "steps": ["站：两脚与髋同宽，哑铃垂在大腿前面，掌心朝自己。", "下：吸气，膝盖微弯后固定不动，屁股往后推（像用屁股关车门），上身前倾，哑铃贴着大腿往下滑，滑到膝盖下面、小腿中段；背始终挺直，感觉大腿后侧被拉紧就停。", "起：呼气，屁股往前顶，回到站直，臀部夹紧，别往后仰。"], "feel": "大腿后侧被拉紧，起身时屁股发力；下背不应该疼。", "mistakes": ["弯腰驼背（最要避免）", "膝盖弯太多变成深蹲", "哑铃离腿太远", "站直时往后仰"], "videos": [{"title": "每天学会一个健身动作：哑铃罗马尼亚硬拉", "by": "人民的健身教练", "len": "1 分钟", "url": "https://www.bilibili.com/video/BV1mTSkBHErk/"}, {"title": "手把手教你如何做一个标准的罗马尼亚硬拉", "by": "UP健身", "len": "约 2 分钟", "url": "https://www.bilibili.com/video/BV1t4421D7LV/"}], "main": "腘绳肌（大腿后侧）、臀大肌（屁股）", "assist": "竖脊肌（脊柱两侧的下背肌肉）、握力", "why": "久坐最容易让大腿后侧和屁股「睡着」、变紧，练它能缓解腰酸、改善骨盆前倾。它教会你用髋部弯腰而不是用腰弯腰，以后从地上搬东西不容易闪到腰。和 A 日练大腿前侧的腿举互补，前后均衡。"}, {"id": "lat_pulldown", "name": "高位下拉", "muscles": "背两侧", "sets": 3, "reps": "12", "rest": "2 分钟", "start": "正式组从 20～25kg 试", "steps": ["调：大腿挡板调到坐下后刚好压住大腿。", "握：横杆，比肩宽一拳半，掌心朝前。", "拉：呼气，先沉肩，再用手肘往下往后带，横杆拉到下巴到锁骨之间；胸口挺起去迎杆，身体后仰 10～15 度。", "回：吸气，2 秒放回，手臂伸直，肩膀被往上拉开。"], "feel": "腋下往下的两侧背发酸。", "mistakes": ["拉到脖子后面", "身体大幅后仰借力", "耸肩", "只用手臂拉"], "videos": [{"title": "详细拆解：如何做一个标准的高位下拉", "by": "UP健身", "len": "约 2 分钟", "url": "https://www.bilibili.com/video/BV1EG411m7YZ/"}, {"title": "18 个固定器械 196 个动作细节", "by": "肌肉小猩猩", "len": "23 分钟", "url": "https://www.bilibili.com/video/BV1SE411e78J/", "tip": "看第 5 段「坐姿高位下拉」"}], "main": "背阔肌（腋下往下、背部两侧那两大块）", "assist": "肱二头肌（大臂前侧）、大圆肌、三角肌后束", "why": "练背的宽度，是「倒三角」的另一半。划船是横着拉，练背中间的厚度；下拉是从上往下拉，练两侧的宽度，两个互补。它也是将来做引体向上的前置练习。"}, {"id": "incline_db_press", "name": "上斜哑铃卧推", "muscles": "上胸", "sets": 3, "reps": "10", "rest": "2 分钟", "start": "每只手 6～8kg 试", "steps": ["凳：靠背调到 30 度左右（从低往上第二、三档）。", "上凳：坐下，哑铃立在大腿上；往后躺的时候，用膝盖把哑铃顶到胸前。", "起始：手臂在胸口上方伸直，掌心朝脚的方向；肩胛骨往后往下夹，脚踩实地面。", "下：吸气，2 秒放到哑铃在胸口两侧、手肘略低于凳面；手肘和身体 45～60 度。", "推：呼气，往上往里推，顶部两只哑铃靠近不碰。", "结束：把哑铃放回胸口，屈膝让哑铃落在大腿上，借这个劲坐起来。"], "feel": "胸口上半部分发酸。", "mistakes": ["屁股离开凳子", "手腕往后折", "放得太快"], "videos": [{"title": "上斜哑铃卧推详解", "by": "凯圣王", "len": "约 11 分钟", "url": "https://www.bilibili.com/video/BV1aa4y1o7XA/"}], "main": "胸大肌上部（锁骨下面那块）", "assist": "三角肌前束（肩膀前面）、肱三头肌（大臂后侧）", "why": "上胸是最难练、又最影响穿衣效果的部分。A 日的推胸机主要练胸的中下部，这个斜着推正好补上半部分。哑铃每只手单独出力，能发现并补平左右的差别。"}, {"id": "lunge", "name": "箭步蹲（或腿举机）", "muscles": "大腿、屁股，单腿", "sets": 3, "reps": "每侧 10", "rest": "2 分钟", "start": "先徒手做，稳了再每只手拿 4～6kg；做腿举机就照 A 日的要点", "steps": ["站直，一只脚往前迈一大步。", "下：吸气，垂直往下蹲，蹲到两个膝盖都约 90 度，后膝接近地面但不碰。", "前腿的膝盖对着脚尖方向，不往里扣；上身保持直立。", "起：呼气，前脚脚掌用力蹬地，回到站立；换另一条腿。"], "feel": "前腿的大腿和屁股发酸。", "mistakes": ["步子太小，膝盖冲出脚尖太多", "前膝往里扣", "上身往前趴"], "videos": [{"title": "箭步蹲膝盖不舒服？（Jeff，中字）", "by": "兔兔姐28", "len": "约 5 分钟", "url": "https://www.bilibili.com/video/BV1jt411n7ag/"}], "main": "股四头肌（大腿前侧）、臀大肌（屁股），以前腿为主", "assist": "内收肌（大腿内侧）、小腿、核心（保持平衡）", "why": "单腿动作，能练平衡，也能把左右腿的力量差练平。走路、上楼梯本质上都是单腿发力，练它对膝盖和髋部的稳定也有好处。和 A 日双腿发力的腿举互补。"}, {"id": "crunch", "name": "卷腹", "muscles": "腹肌", "sets": 3, "reps": "15", "rest": "1 分钟", "start": "徒手", "steps": ["仰卧在垫子上，屈膝，脚踩地。", "双手交叉放胸前，或者轻扶在耳朵两侧，别抱头拉脖子。", "上：呼气，用肚子发力把肩膀卷离地面，下背一直贴地，顶部停 1 秒。", "下：吸气，慢慢放回。"], "feel": "肚子上半部分发酸，脖子不酸。", "mistakes": ["用手拉脖子", "借惯性甩起来", "整个人坐起来"], "videos": [{"title": "如何做一个标准的卷腹？不伤腰，不伤脖子", "by": "猫叔慢跑", "len": "约 2 分钟", "url": "https://www.bilibili.com/video/BV1w64y1u7wS/"}], "main": "腹直肌（肚子正面那几块「腹肌」，偏上半部分）", "assist": "腹斜肌（腰两侧）", "why": "平板支撑练的是「稳住不动」，卷腹练的是「主动弯曲」，两种能力都要有。同样，它不能直接减肚子；等整体体脂降下来，腹肌才会显出来。"}]}], "cardio": {"name": "坡度快走", "minutes": "20～30", "steps": ["先平地走 2 分钟（速度 5）。", "坡度调到 8～10，速度 5～5.5。", "手别抓扶手，抓了就白爬了。", "强度：能说话，但唱不了歌。", "最后 2 分钟坡度降回 0，放松。", "跑步机都被占了就用椭圆机，强度一样。"], "why": "在力量训练之后再多消耗 150～200 千卡，同时练心肺；坡度让屁股和大腿多出力，对膝盖的冲击比跑步小得多。平时一天才三千来步，这是最容易补的一块。"}, "stretch": ["大腿前侧：一手扶墙，另一手抓同侧脚背往屁股拉，膝盖朝下。", "大腿后侧：一条腿伸直架在凳子上，背挺直往前倾。", "臀：坐着，一只脚踝搭在另一条腿的膝盖上，身体前倾。", "胸：小臂贴在门框或器械立柱上，身体往前、往另一侧转。", "背：双手抓住一根立柱，屁股往后坐，让背被拉长。", "肩：一只手臂横在胸前，另一只手压住手肘往身体拉。"], "stretch_note": "每个 30 秒，左右都做。", "home": "在家练也算一次：4kg 哑铃做高脚杯深蹲、俯身划船、肩上推举，加俯卧撑（可以跪着）和平板支撑，各 3 组，每组做到快做不动。", "videos": [{"title": "18 个固定器械 196 个动作细节", "by": "肌肉小猩猩", "len": "23 分钟", "url": "https://www.bilibili.com/video/BV1SE411e78J/", "tip": "想一次把器械都弄明白就看这个：第 2 段推胸、第 4 段器械划船、第 5 段高位下拉、第 11 段腿举"}], "stretch_why": "把刚练过、发紧的肌肉拉开，保持关节的活动范围，身体会舒服一些。第二天的酸痛主要靠休息和时间消退，拉伸只能缓解一点。", "phase": {"name": "基础期", "from": "2026-10-24", "weeks": 6, "until": "2026-12-05", "goal": "6 周内把 10 个动作都做标准、把每周 2 次练成习惯，重量慢慢往上走。", "rules": ["动作比重量重要：每个动作收回来数 3 秒，幅度每次一样；宁可轻一点，也要每一个都标准。", "先加次数、再加重量：同一个重量从 3 × 8～10 练到 3 × 12，都做满了再加一档，加完从 3 × 8 重新往上练。", "每组留 1～2 个的力气，不练到力竭；临时想多练，最多加 1 组。", "不断档：每周至少 2 次，连续 6 周不落；恢复得过来可以改成每周 3 次，A、B、A 轮着练。", "每两周拍一次视频看动作：手机放地上，离 2～3 米，从斜前方 45 度拍全身，脚要拍进去。", "恢复也是训练：蛋白质每天 130g，每晚睡 7 小时以上。"]}}, "trainNext": "B", "trainLast": {"leg_press": {"date": "2026-10-24", "sets": [{"kg": 40, "reps": 10}, {"kg": 40, "reps": 10}, {"kg": 40, "reps": 10}], "top": 40, "note": "两边各挂一片 20kg，不算滑台；做完稍微有点酸，还有余力", "next": "每边加 5kg（一共 50kg），3 × 10"}, "chest_press": {"date": "2026-10-24", "sets": [{"kg": 12, "reps": 10}, {"kg": 12, "reps": 10}, {"kg": 12, "reps": 3}, {"kg": 19, "reps": 6}], "top": 12, "note": "第 3 组 12kg 做了 3 个换 19kg，只做了 6 个；一开始大臂前侧发酸，座椅调高后好一些", "next": "3 组都用 12kg，每组 12 个，收回来数 3 秒；都轻松了再换 19kg，从 3 × 8 开始"}, "seated_row": {"date": "2026-10-24", "sets": [{"kg": 19, "reps": 10}, {"kg": 26, "reps": 10}, {"kg": 26, "reps": 10}, {"kg": 26, "reps": 12}], "top": 26, "note": "多做了 1 组，最后一组 26kg 做满 12 个", "next": "3 组都用 26kg，每组做到 12 个"}, "db_shoulder_press": {"date": (() => {

  const upd = uDate === D.today ? `${uTime} 更新` : `${md(uDate)} ${uTime} 更新`;

  document.querySelectorAll('.view .sub').forEach((el, i) => { if (i > 0) el.insertAdjacentHTML('beforeend', `<span class="upd">${upd}</span>`); });
  // over：超过一圈后第二圈用的颜色。上限类（热量、脂肪、碳水）传 'over' 画成红色；目标类（蛋白质、力量）不传，沿用原色
  function ring(svg, cx, r, w, frac, color, track, over) {
    el('circle', { cx, cy: cx, r, fill: 'none', stroke: v(track), 'stroke-width': w }, svg);
    const c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac)), x = Math.max(0, Math.min(1, frac - 1));
    if (f > 0) el('circle', { cx, cy: cx, r, fill: 'none', stroke: v(color), 'stroke-width': w, 'stroke-linecap': 'round',
      'stroke-dasharray': `${c * f} ${c}`, transform: `rotate(-90 ${cx} ${cx})` }, svg);
    if (x > 0) {
      // 第二圈从 12 点起笔（平头），末端是圆头，下面垫一层阴影，和第一圈分开
      const col = v(over || color), a = (x * 360 - 90) * Math.PI / 180, ex = cx + r * Math.cos(a), ey = cx + r * Math.sin(a);
      el('circle', { cx: ex, cy: ey, r: w / 2, fill: '#000', 'fill-opacity': .45, filter: 'url(#tipsh)' }, svg);
      el('circle', { cx, cy: cx, r, fill: 'none', stroke: col, 'stroke-width': w,
        'stroke-dasharray': `${c * x} ${c}`, transform: `rotate(-90 ${cx} ${cx})` }, svg);
      el('circle', { cx: ex, cy: ey, r: w / 2, fill: col }, svg);
    }
  }
  const ti = D.todayInfo;
  // ---------- 目标页 ----------
  (() => {
    if (T.body_fat_goal == null) return;
    const start = T.body_fat_start, goal = T.body_fat_goal;
    const d0 = dt('2026-10-22'), d1 = dt(T.body_fat_goal_date), now = dt(D.today);
    const total = Math.round((d1 - d0) / 864e5), elapsed = Math.round((now - d0) / 864e5), left = total - elapsed;
    const cur = D.week.medBodyFat == null ? start : D.week.medBodyFat;
    const planAt = (days) => start - (start - goal) * Math.max(0, Math.min(1, days / total));
    const plan = planAt(elapsed), gap = cur - plan;
    const done = Math.max(0, Math.min(1, (start - cur) / (start - goal)));
    let pill, cls = '';
    if (elapsed < 7) pill = '刚开始';
    else if (gap > 0.3) { pill = `落后 ${gap.toFixed(1)}`; cls = 'behind'; }
    else if (gap < -0.3) pill = `领先 ${(-gap).toFixed(1)}`;
    else pill = '按计划';
    const perWeek = ((start - goal) / total * 7).toFixed(1);
    $('goal-sub').textContent = `3 个月，体脂率从 ${start}% 降到 ${goal}%`;
    $('goal').innerHTML = `
      <div class="top"><div><div class="eyebrow">离截止还有</div><div class="title">${md(T.body_fat_goal_date)}，体脂率 ${goal}%</div></div>
        <div class="count"><b>${left}</b><span>天</span></div></div>
      <div class="nums">
        <div class="end">起点<b>${start.toFixed(1)}%</b></div>
        <div class="now"><b>${cur.toFixed(1)}<small>%</small></b><span>现在，已完成 ${Math.round(done * 100)}%</span></div>
        <div class="end" style="text-align:right">目标<b>${goal}%</b></div>
      </div>
      <svg id="goal-chart" aria-hidden="true"></svg>
      <div class="status"><i class="${cls}">${pill}</i><span>${elapsed < 7 ? `接下来每周要降 ${perWeek} 个百分点，体重大约每周 −0.5 公斤` : `每周要降 ${perWeek} 个百分点，按计划今天该在 ${plan.toFixed(1)}%`}</span></div>`;

    const drawTimeline = () => {
      const svg = $('goal-chart'); svg.innerHTML = '';
      const W = svg.clientWidth || 340, H = 150, L = 2, R = 2, Tp = 8, B = 18;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const readings = D.log.filter((r) => r.bodyFat != null && dt(r.date) >= d0);
      const lo = goal - 1, hi = Math.max(start, ...readings.map((r) => r.bodyFat)) + 0.5;
      const X = (d) => L + (W - L - R) * Math.max(0, Math.min(1, (d - d0) / (d1 - d0)));
      const Y = (val) => Tp + (H - Tp - B) * (1 - (val - lo) / (hi - lo));
      el('rect', { x: L, y: Y(goal), width: W - L - R, height: H - B - Y(goal), fill: 'rgba(43,212,154,.10)' }, svg);
      for (const m of ['2026-11-22', '2026-12-22']) {
        el('line', { x1: X(dt(m)), x2: X(dt(m)), y1: Tp, y2: H - B, stroke: 'rgba(241,242,244,.08)' }, svg);
        el('text', { x: X(dt(m)), y: H - 4, 'text-anchor': 'middle' }, svg).textContent = md(m);
      }
      el('line', { x1: X(d0), y1: Y(start), x2: X(d1), y2: Y(goal), stroke: 'rgba(241,242,244,.55)', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, svg);
      el('line', { x1: X(now), x2: X(now), y1: Tp, y2: H - B, stroke: 'rgba(241,242,244,.35)' }, svg);
      readings.forEach((r) => el('circle', { cx: X(dt(r.date)), cy: Y(r.bodyFat), r: 3, fill: 'rgba(241,242,244,.45)' }, svg));
      el('circle', { cx: X(now), cy: Y(cur), r: 6, fill: 'var(--goal)', stroke: 'var(--hero)', 'stroke-width': 2 }, svg);
      el('circle', { cx: X(d1), cy: Y(goal), r: 5, fill: 'none', stroke: 'var(--goal)', 'stroke-width': 2 }, svg);
      el('text', { x: L, y: H - 4 }, svg).textContent = md('2026-10-22');
      el('text', { x: W - R, y: H - 4, 'text-anchor': 'end' }, svg).textContent = md(T.body_fat_goal_date);
      el('text', { x: W - R - 14, y: Y(goal) + 12, 'text-anchor': 'end' }, svg).textContent = `目标 ${goal}%`;
    };
    goalDraw = drawTimeline;

    // 要做到的三件事：都看近 7 天
    const W7 = D.week;
    const key = (ok, label, value, unit, note) => `<div class="row"><span class="l">${label}<small>${note}</small></span>
      <span class="r">${value}<small>${unit}</small></span><span class="chip2 ${ok == null ? 'idle' : ok ? 'good' : 'warn'}">${ok == null ? '没数据' : ok ? '做到了' : '还没做到'}</span></div>`;
    $('g-keys').innerHTML =
      key(W7.strength >= T.strength_per_week, '力量训练', W7.strength, `/ ${T.strength_per_week} 次`, '每周至少 2 次，掉的才是脂肪不是肌肉') +
      key(W7.daysLogged ? W7.proteinDays >= W7.daysLogged - 1 : null, '蛋白质到 130 克', W7.proteinDays, `/ ${W7.daysLogged} 天`, '最多允许 1 天没到') +
      key(W7.avgKcal ? W7.avgKcal >= T.kcal_low - 100 && W7.avgKcal <= T.kcal_high + 50 : null, '平均热量', fmt(W7.avgKcal || 0), '千卡', `每天 ${fmt(T.kcal_low)}–${fmt(T.kcal_high)}，别忽高忽低`);

    // 每周检查点：按自然周（周一到周日），和「记录」页、周日复盘对齐。
    // 第 1 周是起点所在的那一周，最后一周到截止日为止；计划值是这一周最后一天该到的数，实际值用这一周测量的中位数
    const med = (a) => { const s = a.slice().sort((p, q) => p - q); const k = s.length >> 1; return s.length ? (s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2) : null; };
    const mon0 = new Date(d0); mon0.setUTCDate(mon0.getUTCDate() - (mon0.getUTCDay() + 6) % 7);
    const weeks = Math.ceil((Math.round((d1 - mon0) / 864e5) + 1) / 7);
    let rowsHtml = '';
    for (let k = 1; k <= weeks; k++) {
      const ws = new Date(mon0); ws.setUTCDate(ws.getUTCDate() + 7 * (k - 1));
      const we = k === weeks ? new Date(d1) : (() => { const e = new Date(ws); e.setUTCDate(e.getUTCDate() + 6); return e; })();
      const p = k === weeks ? goal : planAt(Math.round((we - d0) / 864e5));
      const vals = D.log.filter((r) => r.bodyFat != null && dt(r.date) >= ws && dt(r.date) <= we).map((r) => r.bodyFat);
      const a = med(vals);
      const isNow = now >= ws && now <= we, future = now < ws;
      const chip = future ? '' : a == null ? '<span class="chip2 idle">没测</span>' : isNow ? '<span class="chip2 idle">本周</span>'
        : a <= p + 0.3 ? '<span class="chip2 good">✓</span>' : '<span class="chip2 warn">落后</span>';
      rowsHtml += `<div class="row logrow cols wk ${isNow ? 'now' : ''}">
        <span class="d">第 ${k} 周<small>${md(iso(ws))}–${md(iso(we))}</small></span>
        <span class="c">${p.toFixed(1)}%</span>
        <span class="c ${a == null ? 'dim' : ''}">${a == null ? '—' : a.toFixed(1) + '%'}</span>
        <span class="c">${chip}</span></div>`;
    }
    $('g-weeks').innerHTML = rowsHtml;
  })();

  // 大圆环：热量；下面一排小圆环：蛋白质、脂肪、碳水、力量训练
  ring($('rings'), 130, 118, 20, ti.kcal / T.kcal_high, 'kcal', 'kcal-track', 'over');
  const E = D.energy || {};

  $('r-kcal').innerHTML = `${fmt(ti.kcal)}<small>千卡，上限 ${fmt(T.kcal_high)}</small>`;
  // 还能吃多少：先保住 500 的缺口。按到现在实际烧掉的算（基础代谢估全天 ＋ 已经动出来的活动），
  // 再减 500 和已经吃的；2,100 只是封顶。动得越多，能吃的越多
  const gapGoal = T.deficit_goal || 500;
  const byBurn = E.active != null && E.basal ? E.basal + E.active - gapGoal : null;
  const cap = byBurn == null ? T.kcal_high : Math.min(T.kcal_high, byBurn);
  const left = cap - ti.kcal;
  $('r-kcal-h').innerHTML = (left >= 0 ? `还能吃 ${fmt(left)}` : `超了 ${fmt(-left)}`) +
    (byBurn != null && byBurn < T.kcal_high ? `<br><small style="font-size:11px">按今天的消耗、留 ${fmt(gapGoal)} 缺口</small>` : '');
  $('r-kcal-h').classList.toggle('over', left < 0);
  // limit：上限，超了标红；goal：目标，到了打勾
  const minis = [
    ['pro', '蛋白质', ti.protein, T.protein_goal, '克', 'goal'],
    ['fat', '脂肪', ti.fat, T.fat_goal, '克', 'limit'],
    ['carb', '碳水', ti.carbs, T.carb_goal, '克', 'limit'],
    ['train', '力量', D.week.strength, T.strength_per_week, '次/周', 'goal'],
  ];
  const check = '<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.3 2.3 4.7-5"/></svg>';
  $('minis').innerHTML = minis.map(([c, label, val, goal, unit, kind]) => {
    const n = val == null ? null : Math.round(val);
    const over = kind === 'limit' && n != null && n > goal, done = kind === 'goal' && n != null && n >= goal;
    const bd = over ? `<span class="bd over">超${n - goal}</span>` : done ? `<span class="bd done" aria-label="达标">${check}</span>` : '';
    return `<div class="mini"><div class="mr"><svg viewBox="0 0 64 64" data-c="${c}" data-f="${n == null ? 0 : n / goal}" data-o="${kind === 'limit' ? 'over' : ''}"></svg>
      <div class="mv ${over ? 'over' : ''}">${n == null ? '—' : fmt(n)}</div>${bd}</div>
      <div class="ml">${label}<small>/ ${goal} ${unit}</small></div></div>`;
  }).join('');
  document.querySelectorAll('#minis svg').forEach((s) => ring(s, 32, 27, 8, +s.dataset.f, s.dataset.c, s.dataset.c + '-track', s.dataset.o || undefined));
  $('advice').textContent = D.advice;
  // 能量账：消耗 = 基础（全天估）＋ 活动（手表，到现在），和摄入比
  // 能量账：今天到现在都是实际发生的数；目标：吃 2,000～2,100，缺口 500，所以烧掉要 2,550 左右
  {
    const eatT = (T.kcal_low + T.kcal_high) / 2, gapT = T.deficit_goal || 500, burnT = eatT + gapT;
    let html = '';
    if (E.burnNow != null) {
      const eat = ti.kcal, burn = E.burnNow, gap = burn - eat, pace = Math.round(burnT * E.frac);
      html += `<div class="eh">今天到现在<small>手表数据截至 ${E.at}</small></div>
        <div class="eq">
          <div><div class="k">吃进</div><div class="n">${fmt(eat)}</div><div class="g">全天目标<br>不超过 ${fmt(T.kcal_high)}</div></div>
          <div><div class="k">实际烧掉</div><div class="n">${fmt(burn)}</div><div class="g">按进度该烧到 ${fmt(pace)}<br><b class="${burn >= pace ? 'ok-t' : 'bad-t'}">${burn >= pace ? '超前 ' + fmt(burn - pace) : '落后 ' + fmt(pace - burn)}</b></div></div>
          <div><div class="k">${gap >= 0 ? '缺口' : '超出'}</div><div class="n ${gap >= 0 ? 'ok-t' : 'bad-t'}">${fmt(Math.abs(gap))}</div><div class="g">全天目标 ${fmt(gapT)} 以上<br><b class="${gap >= gapT ? 'ok-t' : 'bad-t'}">${gap >= gapT ? '✓ 已达标' : '还差 ' + fmt(gapT - Math.max(0, gap))}</b></div></div>
        </div>`;
    }

    if (WE) {
      const gap = WE.burn - WE.eat, max = Math.max(WE.eat, WE.burn, burnT) * 1.08, pct = (x) => (Math.max(0, x) / max * 100).toFixed(1) + '%';
      const row = (label, val, tgt, color, good, diff) => `<div class="wrow"><span>${label}</span>
        <div class="tr"><i style="width:${pct(val)};background:${v(color)}"></i><u style="left:${pct(tgt)}"></u></div>
        <span class="v"><b>${fmt(val)}</b><small class="${good ? 'ok-t' : 'bad-t'}">${good ? '✓ 达标' : diff}</small></span></div>`;
      const eatOver = WE.eat - T.kcal_high, burnShort = burnT - WE.burn, gapShort = gapT - gap;
      let verdict;

      else if (burnShort > Math.max(0, eatOver)) verdict = `<b>问题在消耗</b>：吃得${eatOver > 0 ? '稍多' : '没问题'}，但每天比目标少烧约 <b>${fmt(burnShort)}</b> 千卡。补法：每天多走 5,000～6,000 步（约 200～250 千卡），再加上每周 2 次力量。`;
      else verdict = `<b>问题在吃</b>：每天比上限多吃约 <b>${fmt(eatOver)}</b> 千卡，先把吃的压到 ${fmt(T.kcal_high)} 以内。`;
      html += `<div class="eh">过去 7 天，平均每天<small>不含今天 · 竖线是目标</small></div>
        ${row('吃进', WE.eat, eatT, 'kcal', WE.eat <= T.kcal_high, '多 ' + fmt(eatOver))}
        ${row('烧掉', WE.burn, burnT, 'train', burnShort <= 0, '少 ' + fmt(burnShort))}
        ${row('缺口', gap, gapT, gap >= gapT ? 'train' : 'over', gapShort <= 0, '差 ' + fmt(gapShort))}
        <div class="diag">${verdict}<small>烧掉 = 基础代谢（手表估约 ${fmt(E.basal)}/天）＋ 活动；手表的估算可能差 10% 左右，最后以体重的 7 天平均为准。</small></div>`;
    }
    if (html) { $('energy').hidden = false; $('energy').innerHTML = html; }
  }

  const W = D.week;
  const icon = {
    scale: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a3 3 0 0 1 6 0"/><path d="M12 10l1.5-1.5"/></svg>',
    trend: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 3 7-7"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
    egg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3c3.5 0 6 6 6 10a6 6 0 0 1-12 0c0-4 2.5-10 6-10z"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
    walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.5"/><path d="M10 21l2-6 3 3v3M9 12l2-4 3 2 3 1M12 8l-1 7"/></svg>',
    days: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
    steps: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.5"/><path d="M10 21l2-6 3 3v3M9 12l2-4 3 2 3 1M12 8l-1 7"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  };
  const row = (bg, ic, label, value, unit, note) =>
    `<div class="row"><span class="badge" style="background:${bg}">${icon[ic]}</span>
      <span class="l">${label}${note ? `<small>${note}</small>` : ''}</span>
      <span class="r">${value}<small>${unit}</small></span></div>`;
  $('g-body').innerHTML =
    row('#8D929A', 'scale', '今早体重', ti.weight == null ? '—' : ti.weight.toFixed(2), '公斤',
      ti.weightDelta == null ? (ti.weight == null ? '今天还没称' : '') : `比上次 ${signed(ti.weightDelta)}`) +
    row(v('kcal'), 'trend', '最近 7 次平均', W.avgWeight.toFixed(2), '公斤', `比起点 ${T.start_weight} ${signed(W.weightChange)}`) +
    row('#8D929A', 'scale', '今早体脂率', ti.bodyFat == null ? '—' : ti.bodyFat.toFixed(1), '%',
      W.medBodyFat == null ? '' : `最近几次的中位数 ${W.medBodyFat.toFixed(1)}%，单天会跳`) +

    row('#8D929A', 'days', '已经连续记录', D.streak, '天', `从 ${md(D.startDate)} 开始`);
  const Y = D.yday;
  $('g-act').innerHTML =
    row(v('train'), 'steps', '昨天走了', Y.steps == null ? '—' : fmt(Y.steps), '步',
      W.avgSteps == null ? '' : `近 7 天平均 ${fmt(W.avgSteps)} 步`) +
    row(v('sleep'), 'moon', '昨晚睡了', Y.sleep == null ? '—' : Y.sleep.toFixed(1), Y.sleep == null ? '' : '小时',
      Y.sleep == null ? '没记到，戴着手表睡才有' : `近 7 晚平均 ${W.avgSleep.toFixed(1)} 小时`);
  $('week-range').textContent = `${md(W.from)}–${md(W.to)}`;
  $('g-week').innerHTML =
    row(v('kcal'), 'flame', '平均热量', fmt(W.avgKcal), '千卡', `目标 ${fmt(T.kcal_low)}–${fmt(T.kcal_high)}`) +
    row(v('pro'), 'egg', '平均蛋白质', fmt(W.avgProtein), '克', `${W.daysLogged} 天里有 ${W.proteinDays} 天到 ${T.protein_goal} 克`) +
    (W.macroDays ? row(v('fat'), 'egg', '平均脂肪', fmt(W.avgFat), '克', `目标 ${T.fat_goal} 克，${W.macroDays} 天有数据`) +
                   row(v('carb'), 'flame', '平均碳水', fmt(W.avgCarbs), '克', `目标 ${T.carb_goal} 克左右`) : '') +
    row(v('train'), 'bolt', '力量训练', W.strength, `/ ${T.strength_per_week} 次`, '');
  $('foot').innerHTML = `数据更新于 ${D.updated}<br>身体是唯一不能回滚的生产环境<br><span style="opacity:.6">页面版本 ${D.built}</span>`;

  // ---------- 趋势 ----------
  let metric = 'weight', range = 14;
  function frame(box, days, y0, y1, ticks, tickFmt) {
    box.innerHTML = '';
    const Wd = box.clientWidth, H = box.clientHeight, L = 44, R = 14, Tp = 12, B = 24;
    const svg = el('svg', { viewBox: `0 0 ${Wd} ${H}` }, box);
    const n = days.length, pw = Wd - L - R, ph = H - Tp - B, band = pw / n;
    const X = (i) => L + band * (i + 0.5), Y = (val) => Tp + ph * (1 - (val - y0) / (y1 - y0));
    for (const t of ticks) {
      el('line', { x1: L, x2: Wd - R, y1: Y(t), y2: Y(t), stroke: v('grid') }, svg);
      el('text', { x: L - 8, y: Y(t) + 4, 'text-anchor': 'end' }, svg).textContent = tickFmt(t);
    }
    const step = n <= 8 ? 1 : n <= 16 ? 3 : 7;
    days.forEach((r, i) => { if ((n - 1 - i) % step === 0) el('text', { x: X(i), y: H - 5, 'text-anchor': 'middle' }, svg).textContent = md(r.date); });
    const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
    const cross = el('line', { y1: Tp, y2: Tp + ph, stroke: v('muted'), 'stroke-opacity': .5, opacity: 0 }, svg);
    const f = { svg, Wd, L, R, Tp, ph, pw, band, X, Y, n, tip, cross, days, label: () => '' };
    const show = (ev) => {
      const rect = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - rect.left - L) / band)));
      const text = f.label(days[i]);
      if (!text) { tip.style.opacity = 0; cross.setAttribute('opacity', 0); return; }
      tip.innerHTML = `<span class="d">${md(days[i].date)} 周${wk(days[i].date)}</span>${text}`;
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
      const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(Wd - tw, X(i) - tw / 2)) + 'px';
      tip.style.opacity = 1;
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') { tip.style.opacity = 0; cross.setAttribute('opacity', 0); } });
    return f;
  }
  document.addEventListener('pointerdown', (ev) => {
    if (!$('chart').contains(ev.target)) document.querySelectorAll('#chart .tip').forEach((t) => (t.style.opacity = 0));
  });

  function bars(f, key, top, color, opts) {
    const w = Math.min(18, f.band - 3);
    if (opts.band) el('rect', { x: f.L, width: f.pw, y: f.Y(opts.band[1]), height: f.Y(opts.band[0]) - f.Y(opts.band[1]), fill: v('kcal-soft') }, f.svg);
    const bar = (x0, x1, yt, yb, fill, op) => { const rr = Math.min(4, yb - yt, (x1 - x0) / 2);
      el('path', { d: `M${x0},${yb} V${yt + rr} Q${x0},${yt} ${x0 + rr},${yt} H${x1 - rr} Q${x1},${yt} ${x1},${yt + rr} V${yb} Z`, fill, 'fill-opacity': op }, f.svg); };
    f.days.forEach((r, i) => {
      const val = r[key]; if (!val) return;
      const x0 = f.X(i) - w / 2, x1 = f.X(i) + w / 2, yt = f.Y(Math.min(val, top)), yb = f.Y(0), op = r.date === D.today ? .35 : 1;
      if (opts.cap && val > opts.cap + opts.tol) {  // 和「记录」一致：多出 50 以内算达标，不标红
        const yc = f.Y(opts.cap);
        el('rect', { x: x0, width: w, y: yc, height: yb - yc, fill: v(color), 'fill-opacity': op }, f.svg);
        bar(x0, x1, yt, yc, v('over'), op);
      } else bar(x0, x1, yt, yb, v(color), op);
    });
    if (opts.goal) el('line', { x1: f.L, x2: f.Wd - f.R, y1: f.Y(opts.goal), y2: f.Y(opts.goal), stroke: v('ink2') }, f.svg);
  }

  function drawChart() {
    const days = D.days.slice(-range);
    const box = $('chart');
    const done = days.filter((r) => r.date !== D.today);
    let stats = [];
    if (metric === 'weight') {
      const vals = days.filter((r) => r.weight != null).map((r) => r.weight).concat([T.start_weight]);
      const lo = Math.floor((Math.min(...vals) - 0.2) * 2) / 2, hi = Math.ceil((Math.max(...vals) + 0.2) * 2) / 2;
      const ticks = []; for (let t = lo; t <= hi + 1e-9; t += 0.5) ticks.push(t);
      const f = frame(box, days, lo, hi, ticks, (t) => t.toFixed(1));
      el('line', { x1: f.L, x2: f.Wd - f.R, y1: f.Y(T.start_weight), y2: f.Y(T.start_weight), stroke: v('ink2'), 'stroke-opacity': .5 }, f.svg);
      const pts = [];
      days.forEach((r, i) => {
        if (r.weight == null) return;
        el('circle', { cx: f.X(i), cy: f.Y(r.weight), r: 4, fill: v('dot'), stroke: v('surface'), 'stroke-width': 2 }, f.svg);
        if (r.avg7 != null) pts.push([f.X(i), f.Y(r.avg7)]);
      });
      if (pts.length) {
        el('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: v('kcal'), 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, f.svg);
        const [lx, ly] = pts[pts.length - 1];
        el('circle', { cx: lx, cy: ly, r: 5, fill: v('kcal'), stroke: v('surface'), 'stroke-width': 2 }, f.svg);
      }
      f.label = (r) => r.weight == null ? '' : `称重 <b>${r.weight.toFixed(2)}</b>，平均 <b>${r.avg7.toFixed(2)}</b>`;
      const ws = days.filter((r) => r.weight != null);
      const lastAvg = ws.length ? ws[ws.length - 1].avg7 : null;
      $('ch-big').innerHTML = lastAvg == null ? '—' : `${lastAvg.toFixed(2)}<small>公斤</small>`;
      $('ch-cap').textContent = lastAvg == null ? '' : `最近 7 次平均，比起点 ${signed(lastAvg - T.start_weight)}`;
      $('keys').innerHTML = `<span><i style="width:8px;height:8px;border-radius:50%;background:${v('dot')}"></i>每天称重</span>
        <span><i style="width:14px;height:3px;border-radius:2px;background:${v('kcal')}"></i>7 次平均</span>
        <span><i style="width:14px;height:1px;background:${v('ink2')}"></i>起点</span>`;
      const wv = ws.map((r) => r.weight);
      stats = wv.length ? [['最低', Math.min(...wv).toFixed(2), '公斤'], ['最高', Math.max(...wv).toFixed(2), '公斤'], ['称了', wv.length, `/ ${days.length} 天`]] : [];
    } else if (metric === 'bodyFat') {
      const vals = days.filter((r) => r.bodyFat != null).map((r) => r.bodyFat);
      const lo = vals.length ? Math.floor(Math.min(...vals) - 0.5) : 20, hi = vals.length ? Math.ceil(Math.max(...vals) + 0.5) : 30;
      const ticks = []; for (let t = lo; t <= hi + 1e-9; t += 1) ticks.push(t);
      const f = frame(box, days, lo, hi, ticks, (t) => t + '%');
      const pts = [];
      days.forEach((r, i) => { if (r.bodyFat == null) return; pts.push([f.X(i), f.Y(r.bodyFat)]); });
      if (pts.length > 1) el('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: v('dot'), 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, f.svg);
      pts.forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 4.5, fill: v('kcal'), stroke: v('surface'), 'stroke-width': 2 }, f.svg));
      f.label = (r) => r.bodyFat == null ? '' : `体脂率 <b>${r.bodyFat.toFixed(1)}%</b>`;
      $('ch-big').innerHTML = W.medBodyFat == null ? '—' : `${W.medBodyFat.toFixed(1)}<small>%</small>`;
      $('ch-cap').textContent = '最近几次的中位数；体脂秤受水分影响，单天会跳，看几周的趋势';
      $('keys').innerHTML = `<span><i style="width:8px;height:8px;border-radius:50%;background:${v('kcal')}"></i>每次测量</span>`;
      stats = vals.length ? [['最低', Math.min(...vals).toFixed(1), '%'], ['最高', Math.max(...vals).toFixed(1), '%'], ['测了', vals.length, `/ ${days.length} 天`]] : [];
    } else if (metric === 'steps' || metric === 'sleep') {
      // 都是过完的日子才有数：步数是那一天走的，睡眠记在醒来的那天
      const isS = metric === 'steps', key = metric, color = isS ? 'train' : 'sleep', unit = isS ? '步' : '小时';
      const vals = days.map((r) => r[key]).filter((x) => x != null);
      const step = isS ? 2000 : 2, top = Math.max(isS ? 8000 : 10, Math.ceil((Math.max(0, ...vals) + (isS ? 1 : 0.1)) / step) * step);
      const ticks = []; for (let t = 0; t <= top; t += step) ticks.push(t);
      const f = frame(box, days, 0, top, ticks, isS ? ((t) => t ? (t / 1000) + 'K' : '0') : ((t) => t + 'h'));
      bars(f, key, top, color, {});
      el('line', { x1: f.L, x2: f.Wd - f.R, y1: f.Y(0), y2: f.Y(0), stroke: v('muted'), 'stroke-opacity': .5 }, f.svg);
      const show = (x) => isS ? fmt(x) : x.toFixed(1);
      f.label = (r) => r[key] == null ? '' : `<b>${show(r[key])}</b> ${unit}`;
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      $('ch-big').innerHTML = avg == null ? '—' : `${show(avg)}<small>${unit} / ${isS ? '天' : '晚'}</small>`;
      $('ch-cap').textContent = avg == null ? '' : isS ? `有数据的 ${vals.length} 天平均` : `有记录的 ${vals.length} 晚平均；没戴手表睡觉的晚上没有数`;
      $('keys').innerHTML = `<span><i style="width:10px;height:10px;border-radius:3px;background:${v(color)}"></i>${isS ? '每天' : '每晚，按醒来那天'}</span>`;
      stats = vals.length ? [['最少', show(Math.min(...vals)), unit], ['最多', show(Math.max(...vals)), unit], [isS ? '有数据' : '有记录', vals.length, `/ ${days.length} ${isS ? '天' : '晚'}`]] : [];
    } else {
      const isK = metric === 'kcal', key = metric, color = isK ? 'kcal' : 'pro';
      const goalTop = isK ? T.kcal_high : T.protein_goal, step = isK ? 500 : 50;
      const top = Math.ceil((Math.max(goalTop, ...days.map((r) => r[key])) + 1) / step) * step;
      const ticks = []; for (let t = 0; t <= top; t += step) ticks.push(t);
      const f = frame(box, days, 0, top, ticks, isK ? ((t) => t ? (t / 1000) + 'K' : '0') : ((t) => String(t)));
      bars(f, key, top, color, isK ? { band: [T.kcal_low, T.kcal_high], cap: T.kcal_high, tol: 50 } : { goal: T.protein_goal });
      el('line', { x1: f.L, x2: f.Wd - f.R, y1: f.Y(0), y2: f.Y(0), stroke: v('muted'), 'stroke-opacity': .5 }, f.svg);
      const unit = isK ? '千卡' : '克';
      f.label = (r) => !r[key] ? '' : `<b>${fmt(r[key])}</b> ${unit}${isK && r[key] > T.kcal_high + 50 ? `，超 ${fmt(r[key] - T.kcal_high)}` : ''}${r.date === D.today ? '（进行中）' : ''}`;
      const vals = done.map((r) => r[key]).filter(Boolean);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      $('ch-big').innerHTML = `${fmt(avg)}<small>${unit} / 天</small>`;
      $('ch-cap').textContent = `吃完的 ${vals.length} 天平均`;
      $('keys').innerHTML = `<span><i style="width:10px;height:10px;border-radius:3px;background:${v(color)}"></i>每天</span>` +
        (isK ? `<span><i style="width:14px;height:10px;border-radius:3px;background:${v('kcal-soft')}"></i>目标 ${fmt(T.kcal_low)}–${fmt(T.kcal_high)}</span>`
             : `<span><i style="width:14px;height:1px;background:${v('ink2')}"></i>目标 ${T.protein_goal} 克</span>`) +
        (isK && days.some((r) => r.kcal > T.kcal_high + 50) ? `<span><i style="width:10px;height:10px;border-radius:3px;background:${v('over')}"></i>超出上限</span>` : '') +
        `<span><i style="width:10px;height:10px;border-radius:3px;background:${v(color)};opacity:.35"></i>今天</span>`;
      const hit = isK ? vals.filter((x) => x >= T.kcal_low - 100 && x <= T.kcal_high + 50).length : vals.filter((x) => x >= T.protein_goal).length;
      stats = vals.length ? [['达标', hit, `/ ${vals.length} 天`], ['最低', fmt(Math.min(...vals)), unit], ['最高', fmt(Math.max(...vals)), unit]] : [];
    }
    $('g-stats').innerHTML = stats.map(([l, val, u]) => `<div class="row"><span class="l">${l}</span><span class="r">${val}<small>${u}</small></span></div>`).join('')
      || '<div class="empty">这段时间还没有数据。</div>';
  }
  const segBind = (id, attr, set) => $(id).addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    set(b.dataset[attr]); drawChart();
  });
  segBind('metric', 'm', (m) => (metric = m));
  segBind('range', 'r', (r) => (range = +r));

  // ---------- 记录：按周分组 ----------
  (() => {
    const rows = D.log.slice().reverse().filter((r) => r.kcal || r.weight != null);
    const mondayOf = (s) => { const d = dt(s); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return iso(d); };
    const thisMon = mondayOf(D.today);
    const lastMon = (() => { const d = dt(thisMon); d.setUTCDate(d.getUTCDate() - 7); return iso(d); })();
    const groups = [];
    for (const r of rows) {
      const m = mondayOf(r.date);
      if (!groups.length || groups[groups.length - 1].m !== m) groups.push({ m, rows: [] });
      groups[groups.length - 1].rows.push(r);
    }
    $('loglist').innerHTML = groups.map((g) => {
      const end = dt(g.m); end.setUTCDate(end.getUTCDate() + 6);
      const nth = Math.round((dt(g.m) - dt(mondayOf(D.startDate))) / 864e5 / 7) + 1;
      const name = g.m === thisMon ? '本周' : g.m === lastMon ? '上周' : `第 ${nth} 周`;
      return `<div class="gh"><h2>${name}</h2><span>${md(g.m)}–${md(iso(end))}</span></div>
        <div class="loghead cols"><span></span><span>热量</span><span>蛋白</span><span>体重</span></div>
        <div class="group">${g.rows.map((r) => {
          const live = r.date === D.today;
          const kOk = !live && r.kcal >= T.kcal_low - 100 && r.kcal <= T.kcal_high + 50;
          const pOk = !live && r.protein >= T.protein_goal;
          const tag = live ? '<span class="tag live">进行中</span>' : r.strength ? '<span class="tag s">力量</span>' : r.walk ? '<span class="tag w">走路</span>' : '';
          return `<div class="row logrow cols">
            <span class="d">${md(r.date)}<small>周${wk(r.date)}</small>${tag}</span>
            <span class="c ${r.kcal > T.kcal_high + 50 ? 'over' : ''}">${kOk ? `<i class="ok" style="background:${v('kcal')}"></i>` : ''}${r.kcal ? fmt(r.kcal) : '—'}</span>
            <span class="c">${pOk ? `<i class="ok" style="background:${v('pro')}"></i>` : ''}${r.protein ? fmt(r.protein) : '—'}</span>
            <span class="c ${r.weight == null ? 'dim' : ''}">${r.weight == null ? '—' : r.weight.toFixed(2)}</span></div>`;
        }).join('')}</div>`;
    }).join('');
  })();

  // ---------- 训练 ----------
  (() => {
    const by = Object.fromEntries(D.log.map((r) => [r.date, r]));
    let html = '';
    for (let k = 6; k >= 0; k--) {
      const d = dt(D.today); d.setUTCDate(d.getUTCDate() - k);
      const r = by[iso(d)];
      const cls = r && r.strength ? 's' : r && r.walk ? 'w' : '';
      html += `<div class="${cls} ${k === 0 ? 'today' : ''}"><div class="wd">${WK[d.getUTCDay()]}</div><div class="mk">${d.getUTCDate()}</div></div>`;
    }
    $('strip').innerHTML = html;
    const n = W.strength, goal = T.strength_per_week;
    ring($('week-ring'), 52, 40, 16, n / goal, 'train', 'train-track');
    $('wk-v').innerHTML = `${n}<small>/ ${goal} 次</small>`;
    $('wk-h').textContent = n >= goal ? '这 7 天的力量训练达标了。'
      : n === 0 ? '这 7 天还没练力量。今晚在家练 15 分钟，就算一次。' : `再练 ${goal - n} 次就达标。`;
    // 训练计划：A、B 两天切换，默认显示下次该练的那天；每个动作点开看步骤
    const P = D.training, LAST = D.trainLast || {};
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    // 「调：坐进去……」这种，冒号前面的短词加粗
    const step = (t) => { const m = /^([^：]{1,8})：(.*)$/.exec(t); return m ? `<b>${esc(m[1])}</b>：${esc(m[2])}` : esc(t); };
    const play = '<svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z" fill="#fff"/></svg>';
    const vids = (a) => `<div class="vids">${a.map((x) => `<a class="vid" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="pl">${play}</span>
      <span class="t">${esc(x.title)}<small>${esc(x.by)} · ${esc(x.len)}${x.tip ? ' · ' + esc(x.tip) : ''}</small></span></a>`).join('')}</div>`;
    const setsTxt = (a) => a.map((x) => `${x.kg != null ? x.kg + 'kg × ' : ''}${x.reps}`).join('，');
    const repsTxt = (e) => `${e.sets} 组 × ${e.reps}${/秒|每侧/.test(e.reps) ? '' : ' 次'}`;
    const exById = {};
    if (P) P.days.forEach((d) => d.exercises.forEach((e) => (exById[e.id] = e)));
    function planDay(id) {
      const d = P.days.find((x) => x.id === id);
      $('tday').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.d === id));
      $('g-plan').innerHTML = d.exercises.map((e, i) => {
        const L = LAST[e.id];
        const last = L && L.top != null ? `${L.top}kg<small>上次 ${md(L.date)}</small>` : L ? `${L.sets.map((x) => x.reps).join('/')}<small>上次 ${md(L.date)}</small>` : '<small>还没练过</small>';
        return `<details class="ex"><summary><span class="no">${i + 1}</span>
          <span class="l">${esc(e.name)}<small>${esc(e.muscles)} · ${repsTxt(e)}</small></span><span class="r">${last}</span>${chev}</summary>
          <div class="body">${L ? `<div class="k">上次（${md(L.date)}）</div>${setsTxt(L.sets)}${L.next ? `<div class="k">下次</div><b>${esc(L.next)}</b>` : ''}` : ''}
          ${e.videos && e.videos.length ? `<div class="k">先看视频</div>${vids(e.videos)}` : ''}
          <div class="k">练什么</div><b>主练</b>：${esc(e.main)}<br><b>辅助</b>：${esc(e.assist)}
          <div class="k">为什么练</div>${esc(e.why)}
          <div class="k">重量和休息</div>${esc(e.start)}；组间休息 ${esc(e.rest)}
          <div class="k">步骤</div><ol>${e.steps.map((t) => `<li>${step(t)}</li>`).join('')}</ol>
          <div class="k">对的感觉</div>${esc(e.feel)}
          <div class="k">常见错误</div><ul class="warn">${e.mistakes.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
          ${e.alt ? `<div class="alt">${step(e.alt)}</div>` : ''}</div></details>`;
      }).join('');
    }
    if (P) {
      $('plan-next').textContent = `下次练 ${D.trainNext} 日`;
      $('tday').innerHTML = P.days.map((d) => `<button data-d="${d.id}" aria-pressed="false">${d.name}${d.id === D.trainNext ? '（下次）' : ''}</button>`).join('');
      $('tday').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) planDay(b.dataset.d); });
      planDay(D.trainNext);
      const flow = (no, name, sub, html) => `<details class="ex plain"><summary><span class="no">${no}</span>
        <span class="l">${name}<small>${sub}</small></span>${chev}</summary><div class="body">${html}</div></details>`;
      const list = (a, tag = 'ol') => `<${tag}>${a.map((t) => `<li>${step(t)}</li>`).join('')}</${tag}>`;
      $('g-flow').innerHTML = (P.phase ? flow('基', `${P.phase.name}：${P.phase.weeks} 周`, `${md(P.phase.from)}–${md(P.phase.until)}，${P.phase.goal.split('，')[0]}`,
          `${esc(P.phase.goal)}<div class="k">规矩</div>` + list(P.phase.rules, 'ul')) : '') +
        flow('1', '热身', `${P.warmup.minutes} 分钟`, `<div class="k">为什么</div>${esc(P.warmup.why)}<div class="k">怎么做</div>` + list(P.warmup.steps)) +
        flow('2', '力量', '上面的 5 个动作，约 40 分钟', list(P.rules, 'ul') + (P.videos ? `<div class="k">器械总览</div>${vids(P.videos)}` : '')) +
        flow('3', P.cardio.name, `${P.cardio.minutes} 分钟`, `<div class="k">为什么</div>${esc(P.cardio.why)}<div class="k">怎么做</div>` + list(P.cardio.steps)) +
        flow('4', '拉伸', P.stretch_note, `<div class="k">为什么</div>${esc(P.stretch_why)}<div class="k">怎么做</div>` + list(P.stretch, 'ul')) +
        flow('家', '不去健身房的时候', '在家练也算一次', esc(P.home));
    }

    $('g-workouts').innerHTML = D.workouts.length ? D.workouts.map((w) => {
      const s = w.kind === '力量';
      const title = s && w.day ? `力量 · ${w.day} 日` : w.kind;
      const sub = [w.minutes ? `${w.minutes} 分钟` : '', w.kcal ? `${w.kcal} 千卡` : '', s && w.exercises.length ? `${w.exercises.length} 个动作` : ''].filter(Boolean).join(' · ');
      const head = `<span class="badge" style="background:${s ? v('train') : v('train-track')};color:${v('train')}">${s ? icon.bolt : icon.walk}</span>
        <span class="l">${title}${sub ? `<small>${sub}</small>` : ''}</span><span class="r">${md(w.date)}<small>周${wk(w.date)}</small></span>`;
      if (!(s && w.exercises.length)) return `<div class="row">${head}</div>`;
      const lines = w.exercises.map((e) => `<li><b>${esc((exById[e.id] || {}).name || e.id)}</b>　${setsTxt(e.sets)}</li>`).join('');
      return `<details class="ex"><summary>${head}${chev}</summary><div class="body"><ul>${lines}</ul></div></details>`;
    }).join('') : '<div class="empty">还没有训练记录。练完告诉 Claude，就会出现在这里。</div>';
  })();

  // ---------- 标签切换 ----------
  const views = { today: 'v-today', trends: 'v-trends', goal: 'v-goal', log: 'v-log', train: 'v-train' };
  const navbar = $('navbar');
  const onScroll = () => navbar.classList.toggle('on', window.scrollY > 40);
  function go(name, push) {
    if (!views[name]) name = 'today';
    for (const k in views) $(views[k]).classList.toggle('on', k === name);
    document.querySelectorAll('#tabbar button').forEach((b) => b.setAttribute('aria-selected', b.dataset.v === name));
    $('navtitle').textContent = $(views[name]).dataset.title;
    window.scrollTo(0, 0); onScroll();
    if (name === 'trends') drawChart();
    if (name === 'goal' && goalDraw) goalDraw();
    if (push) history.replaceState(null, '', '#' + name);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  $('tabbar').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) go(b.dataset.v, true); });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if ($('v-trends').classList.contains('on')) drawChart(); if ($('v-goal').classList.contains('on') && goalDraw) goalDraw(); }, 120); });
  window.addEventListener('hashchange', () => go(location.hash.slice(1), false));
  go((location.hash || '#today').slice(1), false);

  // ---------- 刷新 ----------
  // 加时间戳绕过 GitHub Pages 和浏览器的缓存；从桌面打开时没有地址栏，只能靠这个按钮
  const reload = () => { $('refresh').classList.add('spin'); location.replace(`${location.pathname}?t=${Date.now()}${location.hash}`); };
  $('refresh').addEventListener('click', reload);
  if (location.search) history.replaceState(null, '', location.pathname + location.hash);
  // 切回前台时，有新版本就自动刷新
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' }).then((r) => r.json())
      .then((v) => { if (v.built && v.built !== D.built) reload(); }).catch(() => {});
  });
})();
</script>
</body>
</html>
