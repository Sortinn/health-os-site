<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<title>health-os</title>
<style>
:root {
  color-scheme: light;
  --bg: #F2F3F5; --surface: #FFFFFF; --bar: rgba(242,243,245,.82); --sep: rgba(21,23,26,.10);
  --ink: #15171A; --ink2: #5E636B; --muted: #8D929A; --grid: #E6E8EB; --track: #E9EBEE;
  --kcal: #2A78D6; --kcal-track: rgba(42,120,214,.16); --kcal-soft: rgba(42,120,214,.14);
  --pro: #EB6834; --pro-track: rgba(235,104,52,.16);
  --train: #1BAF7A; --train-track: rgba(27,175,122,.16);
  --fat: #EDA100; --fat-track: rgba(237,161,0,.18);
  --carb: #E87BA4; --carb-track: rgba(232,123,164,.18);
  --dot: #A9AEB6; --tip: #FFFFFF; --shadow: 0 8px 28px rgba(21,23,26,.12);
  --seg: #E4E6EA; --seg-on: #FFFFFF;
  --hero: #15171A; --hero-line: rgba(255,255,255,.08); --goal: #2BD49A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  --tab-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0E1013; --surface: #1A1D22; --bar: rgba(14,16,19,.80); --sep: rgba(255,255,255,.10);
    --ink: #F1F2F4; --ink2: #A9AEB6; --muted: #7E848D; --grid: #2A2E35; --track: #2A2E35;
    --kcal: #3987E5; --kcal-track: rgba(57,135,229,.22); --kcal-soft: rgba(57,135,229,.20);
    --pro: #D95926; --pro-track: rgba(217,89,38,.24);
    --train: #199E70; --train-track: rgba(25,158,112,.24);
    --fat: #C98500; --fat-track: rgba(201,133,0,.26);
    --carb: #D55181; --carb-track: rgba(213,81,129,.26);
    --dot: #5E636B; --tip: #23272D; --shadow: 0 8px 28px rgba(0,0,0,.5);
    --seg: #23272D; --seg-on: #3A3F47;
    --hero: #1F2A26; --hero-line: rgba(255,255,255,.10); --goal: #2BD49A;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: pan-x pan-y; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--kcal); outline-offset: 2px; border-radius: 6px; }

/* 顶部：滚动后出现的小标题栏 */
.navbar { position: fixed; inset: 0 0 auto 0; z-index: 10; padding-top: env(safe-area-inset-top);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .2s; }
.navbar .t { height: 44px; display: grid; place-items: center; font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; }
.navbar.on { border-bottom-color: var(--sep); }
.navbar.on .t { opacity: 1; }

.view { display: none; max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 52px) 16px 0; }
.view.on { display: block; }
.large { margin: 0 0 2px; font-size: 34px; font-weight: 700; letter-spacing: .01em; }
.sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.upd { margin-left: auto; font-size: 13px; }
#updated { margin-left: auto; font-size: 13px; }
.pill { font-size: 12px; color: var(--ink2); border: 1px solid var(--sep); border-radius: 999px; padding: 1px 8px; }

/* 首页目标卡：整页唯一的深色块 */
.goal { background: var(--hero); color: #F1F2F4; border-radius: 22px; padding: 18px 18px 14px; margin-bottom: 14px; display: grid; gap: 14px; border: 1px solid var(--hero-line); }
.goal .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.goal .eyebrow { font-size: 13px; color: rgba(241,242,244,.62); }
.goal .title { font-size: 20px; font-weight: 700; margin-top: 2px; }
.goal .count { text-align: right; line-height: 1; }
.goal .count b { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--goal); }
.goal .count span { display: block; font-size: 12px; color: rgba(241,242,244,.62); margin-top: 4px; }
.goal .nums { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 10px; }
.goal .nums .end { font-size: 13px; color: rgba(241,242,244,.62); font-variant-numeric: tabular-nums; }
.goal .nums .end b { display: block; font-size: 17px; color: #F1F2F4; font-weight: 600; }
.goal .nums .now { text-align: center; font-variant-numeric: tabular-nums; }
.goal .nums .now b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
.goal .nums .now small { font-size: 15px; font-weight: 500; margin-left: 1px; }
.goal .nums .now span { display: block; font-size: 12px; color: rgba(241,242,244,.62); }
.goal svg { display: block; width: 100%; height: 86px; overflow: visible; }
.goal svg text { font-family: var(--font); font-size: 10px; fill: rgba(241,242,244,.55); font-variant-numeric: tabular-nums; }
.goal .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(241,242,244,.82); line-height: 1.5; }
.goal .status i { flex: none; font-style: normal; font-size: 12px; font-weight: 600; color: #0E1013; background: var(--goal); border-radius: 999px; padding: 1px 8px; }
.goal .status i.behind { background: #F5B14C; }

/* 首页圆环 */
.rings { background: var(--surface); border-radius: 22px; padding: 20px 16px 18px; display: grid; justify-items: center; gap: 18px; }
.ring-wrap { position: relative; width: min(240px, 100%); aspect-ratio: 1; }
.ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 16%; display: grid; align-content: center; justify-items: center; gap: 8px; text-align: center; }
.ring-sep { width: 64%; border-top: .5px solid var(--sep); }
.lr .k { display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--ink2); font-size: 12px; }
.lr .k i { width: 7px; height: 7px; border-radius: 50%; }
.lr .v { margin-top: 2px; font-size: 40px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.1; }
.lr .v small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.lr .h { color: var(--muted); font-size: 12px; margin-top: 4px; }
.minis { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; border-top: .5px solid var(--sep); padding-top: 16px; }
.mini { display: grid; justify-items: center; gap: 5px; text-align: center; }
.mini .mr { position: relative; width: 64px; height: 64px; }
.mini svg { width: 64px; height: 64px; display: block; }
.mini .mv { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mini .ml { font-size: 12px; color: var(--ink2); line-height: 1.3; }
.mini .ml small { display: block; color: var(--muted); font-size: 11px; }
.advice { margin: 12px 4px 0; color: var(--ink2); font-size: 14px; line-height: 1.6; }

/* 分组列表（iOS inset grouped） */
.gh { margin: 26px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.gh h2 { margin: 0; font-size: 20px; font-weight: 700; }
.gh span { color: var(--muted); font-size: 13px; }
.group { background: var(--surface); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row .l { flex: 1; min-width: 0; font-size: 16px; }
.row .l small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .r { font-size: 16px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .r small { color: var(--muted); font-size: 13px; margin-left: 3px; }
.badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.badge svg { width: 18px; height: 18px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; margin: 26px 0 6px; }

/* 趋势 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--seg); border-radius: 9px; padding: 2px; margin-bottom: 12px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chart-card { background: var(--surface); border-radius: 16px; padding: 16px 12px 10px 4px; }
.chart-head { padding: 0 4px 6px 16px; }
.chart-head .big { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.chart-head .big small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.chart-head .cap { color: var(--muted); font-size: 13px; }
.chart { position: relative; height: 230px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.keys { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; padding: 4px 4px 4px 16px; }
.keys span { display: inline-flex; align-items: center; gap: 5px; }
.keys i { display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--tip); border-radius: 10px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12px; white-space: nowrap; color: var(--ink); opacity: 0; transition: opacity .12s; z-index: 2; top: -6px; }
.tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .d { color: var(--muted); margin-right: 6px; }
.range { display: flex; justify-content: center; margin-top: 10px; }
.range .seg { width: 180px; margin: 0; }

/* 记录 */
.cols { display: grid; grid-template-columns: 1fr 66px 50px 58px; gap: 6px; align-items: center; }
.loghead { color: var(--muted); font-size: 12px; padding: 0 16px 6px; }
.loghead span, .logrow .c { text-align: right; }
.logrow { min-height: 52px; }
.logrow .d { font-size: 16px; white-space: nowrap; }
.logrow .d small { color: var(--muted); font-size: 13px; margin-left: 4px; }
.logrow .c { font-size: 15px; font-variant-numeric: tabular-nums; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
.logrow .c.dim { color: var(--muted); }
.ok { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.tag { display: inline-block; font-size: 11px; border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.tag.live { color: var(--ink2); border: 1px solid var(--sep); }
.tag.s { color: #fff; background: var(--train); }
.tag.w { color: var(--train); background: var(--train-track); }

/* 训练 */
.week { background: var(--surface); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; }
.week svg { width: 104px; height: 104px; display: block; }
.week .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.week .v small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.week .h { color: var(--ink2); font-size: 14px; line-height: 1.55; margin-top: 4px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 14px 8px; }
.strip .wd { color: var(--muted); font-size: 12px; }
.strip .mk { margin: 6px auto 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink2); border: 2px solid var(--track); }
.strip .s .mk { background: var(--train); border-color: var(--train); color: #fff; }
.strip .w .mk { background: var(--train-track); border-color: var(--train); color: var(--ink); }
.strip .today .wd { color: var(--ink); font-weight: 600; }
.empty { padding: 18px 16px; color: var(--ink2); font-size: 14px; line-height: 1.6; }

/* 底部标签栏 */
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 10; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep); display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 10px; font-weight: 500; }
.tabbar svg { width: 25px; height: 25px; }
.tabbar button[aria-selected="true"] { color: var(--kcal); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="navbar" id="navbar"><div class="t" id="navtitle">今天</div></header>

<main>
  <section class="view" id="v-today" data-title="今天">
    <h1 class="large">今天</h1>
    <p class="sub"><span id="today-date"></span><span class="pill">进行中</span><span id="updated"></span></p>
    <section class="goal" id="goal" aria-label="3 个月目标"></section>
    <div class="rings">
      <div class="ring-wrap">
        <svg viewBox="0 0 260 260" id="rings" aria-hidden="true"></svg>
        <div class="ring-center">
          <div class="lr"><div class="k"><i style="background:var(--kcal)"></i>热量</div><div class="v" id="r-kcal"></div><div class="h" id="r-kcal-h"></div></div>
        </div>
      </div>
      <div class="minis" id="minis"></div>
    </div>
    <p class="advice" id="advice"></p>

    <div class="gh"><h2>身体</h2></div>
    <div class="group" id="g-body"></div>

    <div class="gh"><h2>近 7 天</h2><span id="week-range"></span></div>
    <div class="group" id="g-week"></div>

    <p class="foot" id="foot"></p>
  </section>

  <section class="view" id="v-trends" data-title="趋势">
    <h1 class="large">趋势</h1>
    <p class="sub">点图上的柱子或点，能看到当天的数</p>
    <div class="seg" role="group" aria-label="指标" id="metric">
      <button data-m="weight" aria-pressed="true">体重</button>
      <button data-m="bodyFat" aria-pressed="false">体脂</button>
      <button data-m="kcal" aria-pressed="false">热量</button>
      <button data-m="protein" aria-pressed="false">蛋白质</button>
    </div>
    <div class="chart-card">
      <div class="chart-head"><div class="big" id="ch-big"></div><div class="cap" id="ch-cap"></div></div>
      <div class="chart" id="chart"></div>
      <div class="keys" id="keys"></div>
    </div>
    <div class="range"><div class="seg" role="group" aria-label="时间范围" id="range">
      <button data-r="14" aria-pressed="true">2 周</button><button data-r="28" aria-pressed="false">4 周</button>
    </div></div>
    <div class="gh"><h2>这段时间</h2></div>
    <div class="group" id="g-stats"></div>
  </section>

  <section class="view" id="v-log" data-title="记录">
    <h1 class="large">记录</h1>
    <p class="sub"><span>彩色小点表示当天达标</span></p>
    <div id="loglist"></div>
  </section>

  <section class="view" id="v-train" data-title="训练">
    <h1 class="large">训练</h1>
    <p class="sub">每周练两次力量，在家练也算</p>
    <div class="week">
      <svg viewBox="0 0 104 104" id="week-ring" aria-hidden="true"></svg>
      <div><div class="v" id="wk-v"></div><div class="h" id="wk-h"></div></div>
    </div>
    <div class="gh"><h2>最近 7 天</h2></div>
    <div class="group"><div class="strip" id="strip"></div></div>
    <div class="gh"><h2>练过的</h2></div>
    <div class="group" id="g-workouts"></div>
  </section>
</main>

<nav class="tabbar" role="tablist" id="tabbar">
  <button role="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>今天</button>
  <button role="tab" data-v="trends" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>趋势</button>
  <button role="tab" data-v="log" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>记录</button>
  <button role="tab" data-v="train" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>训练</button>

        el('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: v('kcal'), 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, f.svg);
        const [lx, ly] = pts[pts.length - 1];
        el('circle', { cx: lx, cy: ly, r: 5, fill: v('kcal'), stroke: v('surface'), 'stroke-width': 2 }, f.svg);
      }
      f.label = (r) => r.weight == null ? '' : `称重 <b>${r.weight.toFixed(2)}</b>，平均 <b>${r.avg7.toFixed(2)}</b>`;
      const ws = days.filter((r) => r.weight != null);
      const lastAvg = ws.length ? ws[ws.length - 1].avg7 : null;
      $('ch-big').innerHTML = lastAvg == null ? '—' : `${lastAvg.toFixed(2)}<small>公斤</small>`;
      $('ch-cap').textContent = lastAvg == null ? '' : `最近 7 次平均，比起点 ${signed(lastAvg - T.start_weight)}`;
      $('keys').innerHTML = `<span><i style="width:8px;height:8px;border-radius:50%;background:${v('dot')}"></i>每天称重</span>
        <span><i style="width:14px;height:3px;border-radius:2px;background:${v('kcal')}"></i>7 次平均</span>
        <span><i style="width:14px;height:1px;background:${v('ink2')}"></i>起点</span>`;
      const wv = ws.map((r) => r.weight);
      stats = wv.length ? [['最低', Math.min(...wv).toFixed(2), '公斤'], ['最高', Math.max(...wv).toFixed(2), '公斤'], ['称了', wv.length, `/ ${days.length} 天`]] : [];
    } else if (metric === 'bodyFat') {
      const vals = days.filter((r) => r.bodyFat != null).map((r) => r.bodyFat);
      const lo = vals.length ? Math.floor(Math.min(...vals) - 0.5) : 20, hi = vals.length ? Math.ceil(Math.max(...vals) + 0.5) : 30;
      const ticks = []; for (let t = lo; t <= hi + 1e-9; t += 1) ticks.push(t);
      const f = frame(box, days, lo, hi, ticks, (t) => t + '%');
      const pts = [];
      days.forEach((r, i) => { if (r.bodyFat == null) return; pts.push([f.X(i), f.Y(r.bodyFat)]); });
      if (pts.length > 1) el('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: v('dot'), 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, f.svg);
      pts.forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 4.5, fill: v('kcal'), stroke: v('surface'), 'stroke-width': 2 }, f.svg));
      f.label = (r) => r.bodyFat == null ? '' : `体脂率 <b>${r.bodyFat.toFixed(1)}%</b>`;
      $('ch-big').innerHTML = W.medBodyFat == null ? '—' : `${W.medBodyFat.toFixed(1)}<small>%</small>`;
      $('ch-cap').textContent = '最近几次的中位数；体脂秤受水分影响，单天会跳，看几周的趋势';
      $('keys').innerHTML = `<span><i style="width:8px;height:8px;border-radius:50%;background:${v('kcal')}"></i>每次测量</span>`;
      stats = vals.length ? [['最低', Math.min(...vals).toFixed(1), '%'], ['最高', Math.max(...vals).toFixed(1), '%'], ['测了', vals.length, `/ ${days.length} 天`]] : [];
    } else {
      const isK = metric === 'kcal', key = metric, color = isK ? 'kcal' : 'pro';
      const goalTop = isK ? T.kcal_high : T.protein_goal, step = isK ? 500 : 50;
      const top = Math.ceil((Math.max(goalTop, ...days.map((r) => r[key])) + 1) / step) * step;
      const ticks = []; for (let t = 0; t <= top; t += step) ticks.push(t);
      const f = frame(box, days, 0, top, ticks, isK ? ((t) => t ? (t / 1000) + 'K' : '0') : ((t) => String(t)));
      bars(f, key, top, color, isK ? { band: [T.kcal_low, T.kcal_high] } : { goal: T.protein_goal });
      el('line', { x1: f.L, x2: f.Wd - f.R, y1: f.Y(0), y2: f.Y(0), stroke: v('muted'), 'stroke-opacity': .5 }, f.svg);
      const unit = isK ? '千卡' : '克';
      f.label = (r) => !r[key] ? '' : `<b>${fmt(r[key])}</b> ${unit}${r.date === D.today ? '（进行中）' : ''}`;
      const vals = done.map((r) => r[key]).filter(Boolean);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      $('ch-big').innerHTML = `${fmt(avg)}<small>${unit} / 天</small>`;
      $('ch-cap').textContent = `吃完的 ${vals.length} 天平均`;
      $('keys').innerHTML = `<span><i style="width:10px;height:10px;border-radius:3px;background:${v(color)}"></i>每天</span>` +
        (isK ? `<span><i style="width:14px;height:10px;border-radius:3px;background:${v('kcal-soft')}"></i>目标 ${fmt(T.kcal_low)}–${fmt(T.kcal_high)}</span>`
             : `<span><i style="width:14px;height:1px;background:${v('ink2')}"></i>目标 ${T.protein_goal} 克</span>`) +
        `<span><i style="width:10px;height:10px;border-radius:3px;background:${v(color)};opacity:.35"></i>今天</span>`;
      const hit = isK ? vals.filter((x) => x >= T.kcal_low - 100 && x <= T.kcal_high + 50).length : vals.filter((x) => x >= T.protein_goal).length;
      stats = vals.length ? [['达标', hit, `/ ${vals.length} 天`], ['最低', fmt(Math.min(...vals)), unit], ['最高', fmt(Math.max(...vals)), unit]] : [];
    }
    $('g-stats').innerHTML = stats.map(([l, val, u]) => `<div class="row"><span class="l">${l}</span><span class="r">${val}<small>${u}</small></span></div>`).join('')
      || '<div class="empty">这段时间还没有数据。</div>';
  }
  const segBind = (id, attr, set) => $(id).addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    set(b.dataset[attr]); drawChart();
  });
  segBind('metric', 'm', (m) => (metric = m));
  segBind('range', 'r', (r) => (range = +r));

  // ---------- 记录：按周分组 ----------
  (() => {
    const rows = D.log.slice().reverse().filter((r) => r.kcal || r.weight != null);
    const mondayOf = (s) => { const d = dt(s); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return iso(d); };
    const thisMon = mondayOf(D.today);
    const lastMon = (() => { const d = dt(thisMon); d.setUTCDate(d.getUTCDate() - 7); return iso(d); })();
    const groups = [];
    for (const r of rows) {
      const m = mondayOf(r.date);
      if (!groups.length || groups[groups.length - 1].m !== m) groups.push({ m, rows: [] });
      groups[groups.length - 1].rows.push(r);
    }
    $('loglist').innerHTML = groups.map((g) => {
      const end = dt(g.m); end.setUTCDate(end.getUTCDate() + 6);
      const nth = Math.round((dt(g.m) - dt(mondayOf(D.startDate))) / 864e5 / 7) + 1;
      const name = g.m === thisMon ? '本周' : g.m === lastMon ? '上周' : `第 ${nth} 周`;
      return `<div class="gh"><h2>${name}</h2><span>${md(g.m)}–${md(iso(end))}</span></div>
        <div class="loghead cols"><span></span><span>热量</span><span>蛋白</span><span>体重</span></div>
        <div class="group">${g.rows.map((r) => {
          const live = r.date === D.today;
          const kOk = !live && r.kcal >= T.kcal_low - 100 && r.kcal <= T.kcal_high + 50;
          const pOk = !live && r.protein >= T.protein_goal;
          const tag = live ? '<span class="tag live">进行中</span>' : r.strength ? '<span class="tag s">力量</span>' : r.walk ? '<span class="tag w">走路</span>' : '';
          return `<div class="row logrow cols">
            <span class="d">${md(r.date)}<small>周${wk(r.date)}</small>${tag}</span>
            <span class="c">${kOk ? `<i class="ok" style="background:${v('kcal')}"></i>` : ''}${r.kcal ? fmt(r.kcal) : '—'}</span>
            <span class="c">${pOk ? `<i class="ok" style="background:${v('pro')}"></i>` : ''}${r.protein ? fmt(r.protein) : '—'}</span>
            <span class="c ${r.weight == null ? 'dim' : ''}">${r.weight == null ? '—' : r.weight.toFixed(2)}</span></div>`;
        }).join('')}</div>`;
    }).join('');
  })();

  // ---------- 训练 ----------
  (() => {
    const by = Object.fromEntries(D.log.map((r) => [r.date, r]));
    let html = '';
    for (let k = 6; k >= 0; k--) {
      const d = dt(D.today); d.setUTCDate(d.getUTCDate() - k);
      const r = by[iso(d)];
      const cls = r && r.strength ? 's' : r && r.walk ? 'w' : '';
      html += `<div class="${cls} ${k === 0 ? 'today' : ''}"><div class="wd">${WK[d.getUTCDay()]}</div><div class="mk">${d.getUTCDate()}</div></div>`;
    }
    $('strip').innerHTML = html;
    const n = W.strength, goal = T.strength_per_week;
    ring($('week-ring'), 52, 40, 16, n / goal, 'train', 'train-track');
    $('wk-v').innerHTML = `${n}<small>/ ${goal} 次</small>`;
    $('wk-h').textContent = n >= goal ? '这 7 天的力量训练达标了。'
      : n === 0 ? '这 7 天还没练力量。今晚在家练 15 分钟，就算一次。' : `再练 ${goal - n} 次就达标。`;
    $('g-workouts').innerHTML = D.workouts.length ? D.workouts.map((w) => {
      const s = w.kind === '力量';
      return `<div class="row"><span class="badge" style="background:${s ? v('train') : v('train-track')};color:${v('train')}">${s ? icon.bolt : icon.walk}</span>
        <span class="l">${w.kind}</span><span class="r">${md(w.date)}<small>周${wk(w.date)}</small></span></div>`;
    }).join('') : '<div class="empty">还没有训练记录。练完告诉 Claude，就会出现在这里。</div>';
  })();

  // ---------- 标签切换 ----------
  const views = { today: 'v-today', trends: 'v-trends', log: 'v-log', train: 'v-train' };
  const navbar = $('navbar');
  const onScroll = () => navbar.classList.toggle('on', window.scrollY > 40);
  function go(name, push) {
    if (!views[name]) name = 'today';
    for (const k in views) $(views[k]).classList.toggle('on', k === name);
    document.querySelectorAll('#tabbar button').forEach((b) => b.setAttribute('aria-selected', b.dataset.v === name));
    $('navtitle').textContent = $(views[name]).dataset.title;
    window.scrollTo(0, 0); onScroll();
    if (name === 'trends') drawChart();
    if (push) history.replaceState(null, '', '#' + name);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  $('tabbar').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) go(b.dataset.v, true); });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if ($('v-trends').classList.contains('on')) drawChart(); }, 120); });
  window.addEventListener('hashchange', () => go(location.hash.slice(1), false));
  go((location.hash || '#today').slice(1), false);
})();
</script>
</body>
</html>
